<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HTTP authentication test page</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  body { padding: 24px; font: 22px/1.5 sans-serif; color: #000000; }
  h1 { margin: 0 0 12px; font-size: 32px; }
</style>
</head>
<body>
  <h1>HTTP authentication test page</h1>
  <p>The page beneath the browser's sheet. Its text must stay readable and unchanged.</p>
  <p id="result">Not answered yet.</p>
<script>
  // Runs after the load event, so the page has finished loading when the request appears.
  window.addEventListener("load", () => setTimeout(() => {
    // Open through scripts/serve-tests.py (/pages/http-auth.html): its /private answers 401 with
    // WWW-Authenticate: Basic and accepts alice / secret. Servo 0.8
    // asks the browser for credentials only for navigations (servo-net http_loader.rs), so the
    // page loads it in a frame, added after the load event so the page itself counts as loaded.
    const frame = document.createElement("iframe");
    frame.src = "/private";
    frame.style.cssText = "width: 400px; height: 80px; border: 1px solid #888;";
    frame.addEventListener("load", () =>
      document.getElementById("result").textContent = "The frame loaded.");
    document.body.appendChild(frame);
  }, 0));
</script>
</body>
</html>
