<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mercury test page</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; }
  .square { position: fixed; top: 0; width: 160px; height: 160px; }
  .red { left: 0; background: #ff0000; }
  .blue { right: 0; background: #0000ff; }
  .green { position: fixed; left: 0; right: 0; bottom: 0; height: 80px; background: #00ff00; }
  h1 {
    position: fixed; top: 200px; left: 0; right: 0; margin: 0;
    font: bold 40px sans-serif; color: #000000; text-align: center;
  }
</style>
</head>
<body>
  <div class="square red"></div>
  <div class="square blue"></div>
  <h1>Mercury test page</h1>
  <div class="green"></div>
</body>
</html>
