name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  build-linux:
    name: Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Free disk space for Servo
        shell: bash
        run: |
          set -euo pipefail

          df -h /

          sudo rm -rf \
            /opt/ghc \
            /usr/local/lib/android \
            /usr/share/dotnet
          sudo apt-get clean

          df -h /

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail

          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt

          rustc --version
          cargo --version

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            libclang-dev \
            libfontconfig1-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxkbcommon-x11-dev \
            ninja-build \
            pkg-config \
            xinput

      - name: Run quality checks
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/hermes-qa-target
        run: |
          set -euo pipefail

          df -h /
          make qa

      - name: Reclaim quality-check build space
        shell: bash
        run: |
          set -euo pipefail

          cargo clean --target-dir "${RUNNER_TEMP}/hermes-qa-target"
          df -h /

      - name: Build release executable
        shell: bash
        run: |
          set -euo pipefail

          cargo build \
            --locked \
            --release \
            --package hermes-desktop

      - name: Inspect dynamic dependencies
        shell: bash
        run: |
          set -euo pipefail
          ldd target/release/hermes-desktop

      - name: Create Linux archive
        shell: bash
        run: |
          set -euo pipefail

          package="hermes-browser-linux-x86_64"
          executable="target/release/hermes-desktop"
          output_directory="dist/${package}"
          archive="dist/${package}.tar.gz"
          checksum="${archive}.sha256"

          test -f "${executable}"

          mkdir -p "${output_directory}"

          install \
            -m 0755 \
            "${executable}" \
            "${output_directory}/hermes-browser"

          strip --strip-unneeded \
            "${output_directory}/hermes-browser"

          cp README.md \
            "${output_directory}/README.md"

          if [[ -f LICENSE ]]; then
            cp LICENSE \
              "${output_directory}/LICENSE"
          fi

          tar \
            -C dist \
            -czf "${archive}" \
            "${package}"

          (
            cd dist
            sha256sum \
              "${package}.tar.gz" \
              > "${package}.tar.gz.sha256"
          )

          test -f "${archive}"
          test -f "${checksum}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hermes-browser-linux-x86_64
          path: |
            dist/hermes-browser-linux-x86_64.tar.gz
            dist/hermes-browser-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Windows x86-64
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          rustup update stable
          rustup default stable

          rustc --version
          cargo --version

      - name: Build release executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cargo build `
            --locked `
            --release `
            --package hermes-desktop

      - name: Create Windows archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = "hermes-browser-windows-x86_64"
          $executable = "target/release/hermes-desktop.exe"
          $outputDirectory = "dist/$package"
          $archive = "dist/$package.zip"
          $checksum = "$archive.sha256"

          if (-not (Test-Path $executable)) {
              throw "Release executable not found: $executable"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            $outputDirectory |
            Out-Null

          Copy-Item `
            $executable `
            "$outputDirectory/hermes-browser.exe"

          Copy-Item `
            "README.md" `
            "$outputDirectory/README.md"

          if (Test-Path "LICENSE") {
              Copy-Item `
                "LICENSE" `
                "$outputDirectory/LICENSE"
          }

          Compress-Archive `
            -Path $outputDirectory `
            -DestinationPath $archive `
            -Force

          $hash = (
              Get-FileHash `
                $archive `
                -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          "$hash  $package.zip" |
            Set-Content `
              -Encoding ascii `
              $checksum

          if (-not (Test-Path $archive)) {
              throw "Archive not found: $archive"
          }

          if (-not (Test-Path $checksum)) {
              throw "Checksum not found: $checksum"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hermes-browser-windows-x86_64
          path: |
            dist/hermes-browser-windows-x86_64.zip
            dist/hermes-browser-windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release artifacts
        shell: bash
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -print

      - name: Create or update the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"

          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create \
              "${tag}" \
              --verify-tag \
              --generate-notes \
              --title "${tag}"
          fi

          gh release upload \
            "${tag}" \
            dist/* \
            --clobber
