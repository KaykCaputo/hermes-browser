[package]
name = "mercury-ui"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Names the elements in the generated code, so tests can find them through Slint's testing
# backend. Only for tests: it also turns off one of Slint's optimisations for the whole UI.
test-support = []

[dependencies]
slint.workspace = true

# Only for rendering without a display: `examples/render_settings.rs` (the settings window) and
# `tests/page_request_render.rs` (the dialog components, which also uses talaria-core's message
# cleaning). Dev-only, so the application's Slint features are unchanged.
[dev-dependencies]
image.workspace = true
slint = { workspace = true, features = ["renderer-software"] }
talaria-core = { path = "../talaria-core" }

[build-dependencies]
slint-build.workspace = true
