[package]
name = "mercury-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
slint.workspace = true

[build-dependencies]
slint-build.workspace = true

# menus lane: renders the browser menu and the About window headless (tests/render_menus.rs).
