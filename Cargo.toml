[workspace]
resolver = "3"
members = [
    "apps/hermes-desktop",
    "crates/hermes-ui",
    "crates/talaria-core",
    "crates/talaria-servo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
adblock = "=0.13.2"
content-security-policy = "0.8"
dpi = "0.1"
euclid = "0.22"
gleam = "0.15"
glow = "0.17"
log = "0.4"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
servo = { version = "=0.4.0", features = ["vello"] }
slint = { version = "~1.17.1", default-features = false, features = [
    "backend-winit",
    "compat-1-2",
    "renderer-femtovg",
    "std",
    "unstable-winit-030",
] }
slint-build = "~1.17.1"
surfman = "0.13"
url = "2.5"

# Keep Hermes crates easy to debug while optimizing the browser-engine hotspots used at runtime.
# Targeting the complete dependency graph would also rebuild large native build tools such as
# SpiderMonkey and ANGLE whenever this profile changes.
[profile.dev.package.adblock]
opt-level = 2

[profile.dev.package.servo]
opt-level = 2

[profile.dev.package."servo-constellation"]
opt-level = 2

[profile.dev.package."servo-layout"]
opt-level = 2

[profile.dev.package."servo-net"]
opt-level = 2

[profile.dev.package."servo-paint"]
opt-level = 2

[profile.dev.package."servo-script"]
opt-level = 2

[profile.dev.package.vello]
opt-level = 2

[profile.dev.package.vello_cpu]
opt-level = 2

[profile.dev.package.webrender]
opt-level = 2
