[workspace]
resolver = "3"
members = [
    "apps/hermes-desktop",
    "crates/hermes-ui",
    "crates/talaria-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
slint = { version = "~1.17.1", default-features = false, features = [
    "backend-winit-x11",
    "compat-1-2",
    "renderer-femtovg",
    "std",
] }
slint-build = "~1.17.1"
