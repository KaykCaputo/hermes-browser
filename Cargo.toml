[workspace]
resolver = "3"
members = [
    "apps/mercury-desktop",
    "crates/mercury-downloads",
    "crates/mercury-import",
    "crates/mercury-passwords",
    "crates/mercury-settings",
    "crates/mercury-store",
    "crates/mercury-ui",
    "crates/talaria-core",
    "crates/talaria-servo",
]
exclude = ["third_party/gaol"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"

[workspace.dependencies]
adblock = "=0.13.5"
ash = "0.38"
backtrace = "0.3.77"
content-security-policy = "0.9"
core-foundation = "0.10"
dirs = "7.0"
dpi = "0.1"
euclid = "0.22"
futures-util = "0.3.34"
getrandom = "0.4"
gleam = "0.15"
glow = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2.191"
log = "0.4"
mime_guess = "2.0.5"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false }
percent-encoding = "2.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream"] }
rusqlite = { version = "0.38", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
security-framework = "3.7"
serde = "1"
serde_json = "1"
# The `vello` (GPU canvas) feature is on through the vendored fix in `third_party/servo-canvas`:
# servo-canvas 0.8.0's vello backend does not compile against wgpu 30 as published
# (`vello_backend.rs:756`, `get_mapped_range` returns a `Result`). See its MERCURY.md.
# The build therefore carries two `wgpu` majors: 29 for Slint's FemtoVG renderer (Slint is held at
# 1.17, see below) and 30 for vello 0.11, which Servo's GPU canvas requires. They do not share state.
servo = { version = "=0.8.0", features = [
    "vello",
    "webgl",
    "subtlecrypto",
    "brotli-compression-stream",
] }
# Slint is held at 1.17: i-slint-compiler 1.18 needs icu_properties ^2.2, while Servo 0.8.0's
# mozjs_sys pins icu_capi =2.1.2 (icu_properties ~2.1). Move to 1.18 when one of them relaxes its pin.
slint = { version = "~1.17.1", default-features = false, features = [
    "backend-winit",
    "compat-1-2",
    "renderer-femtovg-wgpu",
    "std",
    "unstable-wgpu-29",
    "unstable-winit-030",
] }
slint-build = "~1.17.1"
# Slint's own testing backend (tests only). Its version must be exactly the `slint` version above:
# it shares Slint's internal crates. Move both together.
i-slint-backend-testing = "=1.17.1"
signal-hook-registry = "1.4.8"
surfman = "0.14"
tempfile = "3.27"
thiserror = "2"
tokio = "1.54.1"
url = "2.5"
zeroize = "1.9"

[patch.crates-io]
gaol = { path = "third_party/gaol" }
servo-canvas = { path = "third_party/servo-canvas" }
surfman = { path = "third_party/surfman" }

# Keep the controller easy to debug while optimizing the browser-engine, frame-transfer, and media
# hotspots used by `make run`. Targeting the complete dependency graph would also rebuild large
# native build tools such as SpiderMonkey and ANGLE whenever this profile changes.
[profile.dev.package.adblock]
opt-level = 2

[profile.dev.package.mercury-desktop]
opt-level = 2

[profile.dev.package.servo]
opt-level = 2

[profile.dev.package."servo-constellation"]
opt-level = 2

[profile.dev.package."servo-layout"]
opt-level = 2

[profile.dev.package."servo-net"]
opt-level = 2

[profile.dev.package."servo-paint"]
opt-level = 2

[profile.dev.package."servo-script"]
opt-level = 2

[profile.dev.package."servo-media-gstreamer"]
opt-level = 2

[profile.dev.package."servo-media-gstreamer-render"]
opt-level = 2

[profile.dev.package."servo-media-gstreamer-render-unix"]
opt-level = 2

[profile.dev.package.surfman]
opt-level = 2

[profile.dev.package."talaria-servo"]
opt-level = 2

[profile.dev.package.vello]
opt-level = 2

[profile.dev.package.vello_cpu]
opt-level = 2

[profile.dev.package.webrender]
opt-level = 2

[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package."wgpu-core"]
opt-level = 2

[profile.dev.package."wgpu-hal"]
opt-level = 2
