[package]
name = "mercury-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mercury-browser"
path = "src/main.rs"

[dependencies]
backtrace.workspace = true
dirs.workspace = true
dpi.workspace = true
euclid.workspace = true
gleam.workspace = true
glow.workspace = true
image.workspace = true
libc.workspace = true
log.workspace = true
mercury-ui = { path = "../../crates/mercury-ui" }
servo.workspace = true
slint.workspace = true
surfman.workspace = true
talaria-core = { path = "../../crates/talaria-core" }
talaria-servo = { path = "../../crates/talaria-servo" }
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ash.workspace = true

# The crash handler is compiled on macOS and Linux only, as in servoshell.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
signal-hook-registry.workspace = true

[build-dependencies]
gl_generator = "0.14"
