[package]
name = "mercury-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mercury-browser"
path = "src/main.rs"

[dependencies]
dpi.workspace = true
euclid.workspace = true
gleam.workspace = true
glow.workspace = true
image.workspace = true
log.workspace = true
mercury-ui = { path = "../../crates/mercury-ui" }
servo.workspace = true
slint.workspace = true
surfman.workspace = true
talaria-core = { path = "../../crates/talaria-core" }
talaria-servo = { path = "../../crates/talaria-servo" }
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ash.workspace = true

# The same objc2 generation as wgpu-hal 29's Metal backend (not winit's objc2 0.5 / objc2-metal 0.2).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "objc2-io-surface",
] }

[build-dependencies]
gl_generator = "0.14"
