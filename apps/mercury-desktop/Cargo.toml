[package]
name = "mercury-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mercury-browser"
path = "src/main.rs"

[dependencies]
backtrace.workspace = true
dirs.workspace = true
dpi.workspace = true
euclid.workspace = true
gleam.workspace = true
glow.workspace = true
image.workspace = true
libc.workspace = true
log.workspace = true
mercury-ui = { path = "../../crates/mercury-ui" }
servo.workspace = true
slint.workspace = true
surfman.workspace = true
talaria-core = { path = "../../crates/talaria-core" }
talaria-servo = { path = "../../crates/talaria-servo" }
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ash.workspace = true

# `NSScreen.visibleFrame`, the screen area outside the menu bar and Dock (`window.screen.avail*`),
# and `deviceDescription` to find the monitor's screen.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSGraphics",
    "NSScreen",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSEnumerator",
    "NSString",
    "NSValue",
] }

# The crash handler is compiled on macOS and Linux only, as in servoshell.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
signal-hook-registry.workspace = true

[build-dependencies]
gl_generator = "0.14"
